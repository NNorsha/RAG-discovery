# Render 一键部署蓝图:https://render.com 新建 Blueprint 指向本仓库即可
services:
  - type: web
    name: rag-kb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /healthz
    envVars:
      - key: EMBED_BACKEND
        value: api
      - key: EMBED_MODEL
        value: embedding-3
      - key: LLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4/
      - key: LLM_MODEL
        value: glm-4-flash
      - key: LLM_API_KEY
        sync: false  # 部署时在控制台填入,不进仓库
